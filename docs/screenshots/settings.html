<!doctype html>
<!--
  Rendering of TitanPointer's settings screen (MainActivity (tabs), no-root mode, default settings),
  styled as Android 10 Theme.Material.Light.DarkActionBar on the Titan's 1440x1440 screen (480dp at 3x).
  Regenerate the PNGs with: node docs/screenshots/render.js
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --primary: #37474F; --primary-dark: #263238; --accent: #2196F3;
    --text-primary: rgba(0,0,0,.87); --text-secondary: rgba(0,0,0,.54);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fafafa; font-family: Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .screen { width: 480px; }
  .status { height: 24px; background: var(--primary-dark); color: #fff; font-size: 14px; display: flex;
            align-items: center; justify-content: space-between; padding: 0 12px 0 16px; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .bar { height: 56px; background: var(--primary); color: #fff; font-size: 20px; font-weight: 500;
         display: flex; flex-direction: column; justify-content: center; padding: 0 16px; }
  .bar .sub { font-size: 14px; font-weight: 400; opacity: .7; margin-top: 1px; }
  .tabs { display: flex; background: var(--primary); box-shadow: 0 2px 4px rgba(0,0,0,.25); position: relative; z-index: 1; }
  .tab { flex: 1; text-align: center; color: #fff; font-size: 14px; font-weight: 700; padding: 13px 0 10px;
         border-bottom: 3px solid transparent; opacity: .65; letter-spacing: .3px; }
  .tab.on { opacity: 1; border-bottom-color: #2196F3; }
  .scroll { height: 356px; overflow: hidden; }
  .seek .ctl { display: flex; align-items: center; }
  .seek .step { width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; }
  .seek .step span { width: 40px; height: 36px; background: #d6d7d7; border-radius: 2px; font-size: 20px; line-height: 36px;
                     text-align: center; color: var(--text-primary); box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 1px 1px rgba(0,0,0,.12); }
  .seek .ctl .track { flex: 1; }
  .content { padding: 8px 16px 32px; }
  .section { font-size: 18px; font-weight: 700; color: var(--text-secondary); padding: 20px 0 6px; }
  .text { font-size: 15px; color: var(--text-secondary); padding: 4px 0; white-space: pre-line; line-height: 1.3; }
  .hint { font-size: 13px; opacity: .7; }
  .ok { color: var(--text-secondary); }
  .btn { display: inline-block; margin: 6px 4px 6px 0; min-width: 88px; height: 36px; padding: 0 16px;
         background: #d6d7d7; border-radius: 2px; font-size: 14px; font-weight: 500; text-transform: uppercase;
         letter-spacing: .5px; color: var(--text-primary); line-height: 36px; text-align: center;
         box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 1px 1px rgba(0,0,0,.12); }
  .row { display: flex; align-items: center; }
  .switch { display: flex; align-items: center; justify-content: space-between; padding: 8px 0;
            font-size: 15px; color: var(--text-primary); }
  .switch .lbl { flex: 1; padding-right: 16px; line-height: 1.3; }
  .sw { position: relative; width: 36px; height: 20px; flex: none; }
  .sw .track { position: absolute; left: 2px; right: 2px; top: 3px; height: 14px; border-radius: 7px; background: rgba(0,0,0,.38); }
  .sw .thumb { position: absolute; top: 0; left: 0; width: 20px; height: 20px; border-radius: 50%; background: #ececec;
               box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .sw.on .track { background: rgba(33,150,243,.5); }
  .sw.on .thumb { left: 16px; background: var(--accent); }
  .radio { display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 15px; color: var(--text-primary); }
  .rb { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(0,0,0,.54); flex: none; position: relative; }
  .rb.on { border-color: var(--accent); }
  .rb.on::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
  .seek .lbl { font-size: 15px; color: var(--text-secondary); padding-top: 8px; }
  .seek .track { position: relative; height: 32px; margin: 0 16px; }
  .seek .line { position: absolute; left: 0; right: 0; top: 15px; height: 2px; background: rgba(0,0,0,.26); }
  .seek .fill { position: absolute; left: 0; top: 15px; height: 2px; background: var(--accent); }
  .seek .knob { position: absolute; top: 10px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--accent); }
  .spinner { display: flex; align-items: center; padding: 4px 0; }
  .spinner .lbl { flex: 1; font-size: 15px; color: var(--text-secondary); }
  .spinner .val { font-size: 16px; color: var(--text-primary); padding: 8px 28px 8px 8px; position: relative; }
  .spinner .val::after { content: ""; position: absolute; right: 6px; bottom: 10px; border-left: 5px solid transparent;
                         border-right: 5px solid transparent; border-top: 5px solid rgba(0,0,0,.54); transform: rotate(-45deg) translate(2px,2px); }
  .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; color: var(--text-secondary); white-space: pre; padding: 4px 0; line-height: 1.35; }
</style>
</head>
<body>
<div class="screen">
  <div class="status"><span>7:40</span><span class="icons">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M12 21L1 8a16 16 0 0 1 22 0z"/></svg>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M2 22h20V2z"/></svg>
    <svg width="9" height="14" viewBox="0 0 10 16" fill="#fff"><rect x="3" y="0" width="4" height="2"/><rect x="0" y="2" width="10" height="14" rx="1"/></svg>
  </span></div>
  <div class="bar"><div>TitanPointer</div><div class="sub">Version 1.25</div></div>
  <div class="tabs" id="tabs"></div>
  <div class="scroll" id="scroll"><div class="content" id="content"></div></div>
</div>
<script>
  // Mirrors MainActivity's tabs as of 1.25 (no-root mode, default settings, Advanced collapsed, diagnostics off).
  // showTab(i) draws tab i; render.js calls it for each screenshot.
  const c = document.getElementById('content');
  const add = (html) => c.insertAdjacentHTML('beforeend', html);
  const section = (t) => add(`<div class="section">${t}</div>`);
  const text = (t, cls = '') => add(`<div class="text ${cls}">${t}</div>`);
  const hint = (t) => text(t, 'hint');
  const button = (t) => `<span class="btn">${t}</span>`;
  const sw = (label, on) => add(`<div class="switch"><span class="lbl">${label}</span><span class="sw ${on ? 'on' : ''}"><span class="track"></span><span class="thumb"></span></span></div>`);
  const seek = (label, min, max, def, fmt) => {
    const f = (def - min) / (max - min) * 100;
    add(`<div class="seek"><div class="lbl">${label}: ${fmt(def)}</div><div class="ctl"><div class="step"><span>−</span></div><div class="track"><div class="line"></div><div class="fill" style="width:${f}%"></div><div class="knob" style="left:${f}%"></div></div><div class="step"><span>+</span></div></div></div>`);
  };
  const spinner = (label, val) => add(`<div class="spinner"><span class="lbl">${label}</span><span class="val">${val}</span></div>`);
  const keyBinding = (label, desc) => { text(`${label}: ${desc}`); add(`<div class="row">${button('Set')}${button('Clear')}${button('Default')}</div>`); };
  const x = (v) => (v / 10).toFixed(1) + '×';

  const TABS = ['Home', 'Pointer', 'Controls', 'Tools', 'About'];
  const pages = [
    () => {
      section('Turn on the service');
      text('✓ Accessibility service is on', 'ok');
      sw('Pointer mode', true);
      hint('Toggle with Alt + Space or the Quick Settings tile “Keyboard pointer”. Keys are set under Controls.');
      text('✓ Titan scroll assistant is on', 'ok');
      section('Gestures and keys');
      text('• Slide: move the pointer\n• Tap: click · tap twice: double tap\n• Tap, then touch again and move: drag\n• Enter: click\n• Alt + Enter: long press\n• Space: scroll mode on/off (slides scroll, taps don’t click)\n• Alt + Space: pointer mode on/off\n• Typing is ignored automatically');
      section('How it works');
      hint('The Titan reports keyboard touches only to the app that has keyboard focus, so while pointer mode is on, TitanPointer holds the focus. Keys can’t reach the app underneath until you turn it off. The Titan’s scroll assistant has to stay on: without it no keyboard touches reach apps at all.');
    },
    () => {
      section('Direction');
      sw('Swap X and Y', false);
      sw('Invert horizontal', false);
      sw('Invert vertical', false);
      section('Pointer');
      seek('Speed', 1, 20, 7, x);
      seek('Acceleration', 0, 40, 10, (v) => (v / 10).toFixed(1));
      seek('Vertical speed', 3, 40, 10, x);
      seek('Pointer size', 6, 30, 10, x);
      seek('Hide pointer when idle', 0, 30, 5, (v) => v === 0 ? 'never' : v + ' s');
    },
    () => {
      section('Clicking');
      sw('Tap to click', true);
      sw('Tap, then touch and move to drag (adds a short click delay)', true);
      seek('Ignore touches after a key press', 0, 1000, 350, (v) => v + ' ms');
      seek('Ignore touches that start in the top key row', 0, 40, 22, (v) => v === 0 ? 'off' : v + '% of the keyboard');
      hint('The top row (Shift, Recents, the home key, Back, Alt) is part of the touch surface. Touches that start there don’t move the pointer or click; a slide that starts lower can still run into it.');
      sw('Click standard buttons directly', true);
      hint('After a keyboard touch the Titan refuses taps on ordinary Android buttons (toolbars, address bars) until a key is pressed. While it does, a tap on the keyboard clicks the button under the pointer through accessibility instead. Web pages and newer app screens still get a normal tap.');
      section('Scrolling');
      hint('Space turns scroll mode on and off. In scroll mode, slides scroll and taps never click.');
      seek('Scroll speed', 2, 60, 15, x);
      sw('Reverse scroll direction', false);
      sw('Fling: a quick flick keeps scrolling', true);
      hint('Flick and lift while still moving to keep scrolling; stop before lifting to stop dead.');
      section('Titan scroll assistant');
      text('✓ TitanPointer can switch the scroll assistant (currently on)');
      sw('Turn the scroll assistant off when pointer mode is off', false);
      hint('The keyboard stops scrolling pages while pointer mode is off. Turning pointer mode on turns it back on, since the pointer needs it. If you turn the TitanPointer service off, the scroll assistant stays as it was.');
      section('Keys');
      keyBinding('Pointer mode on/off', 'Alt + Space');
      hint('Works everywhere. The key is swallowed while it toggles pointer mode, so pick a combination you don’t type with.');
      keyBinding('Click', 'Enter');
      keyBinding('Long press', 'Alt + Enter');
      hint('Click and long press act at the pointer while pointer mode is on.');
      spinner('Letter keys in pointer mode', 'Do nothing');
    },
    () => {
      section('Keyboard input probe');
      hint('Shows everything the keyboard and screen send to an ordinary app. Useful to check that keyboard touches arrive at all.');
      add(button('Open keyboard input probe'));
      section('▸ Advanced: root / ADB (untested)');
      section('Diagnostics');
      hint('What the pointer saw recently: focus changes, which windows opened, keys and where they came from. If the pointer stops working somewhere, reproduce it, come back here and copy this.');
      sw('Capture diagnostics', false);
      add(button('Open tap test screen'));
      add(button('Search phone software for the scroll switch'));
      sw('Test: taps on the keyboard click 1 s late', false);
      sw('Test: send the click key’s click from a timer', false);
      hint('For tracking down clicks that don’t work. Leave off normally.');
    },
    () => {
      section('TitanPointer');
      text('Version 1.25 (build 26)');
      hint('Turns the original Unihertz Titan’s touch-sensitive keyboard into a touchpad with an on-screen pointer. Nothing is collected or sent anywhere.');
      section('Source code and updates');
      text('https://github.com/htubdawg/TitanPointer');
      add(button('Open on GitHub'));
      add(button('Download the latest release'));
      hint('Updates install over the old version: download the APK from the latest release and open it.');
    },
  ];
  function showTab(i) {
    document.getElementById('tabs').innerHTML = TABS.map((t, k) => `<div class="tab ${k === i ? 'on' : ''}">${t.toUpperCase()}</div>`).join('');
    c.innerHTML = '';
    pages[i]();
    document.getElementById('scroll').scrollTop = 0;
  }
  showTab(0);
</script>
</body>
</html>
