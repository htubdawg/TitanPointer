plugins {
    id 'com.android.application'
}

android {
    namespace 'com.titanpointer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.titanpointer'
        minSdk 26          // continued gesture strokes need Android 8.0; the Titan ships with 9+
        targetSdk 34
        versionCode 3
        versionName '1.2'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly. Use your own key for distribution.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // The helper must be extracted to nativeLibraryDir so it can be executed.
        jniLibs { useLegacyPackaging true }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
