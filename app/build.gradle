plugins {
    id 'com.android.application'
}

android {
    namespace 'com.titanpointer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.titanpointer'
        minSdk 26          // continued gesture strokes need Android 8.0; the Titan ships with 9+
        targetSdk 34
        versionCode 5
        versionName '1.4'
        ndk { abiFilters 'arm64-v8a' }
    }

    // A fixed key kept in the repo, so every build (from any machine) can update the installed app.
    // Not a secret: it's a throwaway debug-style key. Android refuses updates signed with another key.
    signingConfigs {
        shared {
            storeFile rootProject.file('signing/titanpointer.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // The helper must be extracted to nativeLibraryDir so it can be executed.
        jniLibs { useLegacyPackaging true }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
