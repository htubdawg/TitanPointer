# Builds the APK and publishes a GitHub release for the version in app/build.gradle.
# Start it from the Actions tab ("Release" → "Run workflow") on main after bumping versionName.
# Tag: v<versionName> (e.g. v1.24), release name: "Version <versionName>".
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (what changed)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read version
        id: version
        run: |
          v=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          if [ -z "$v" ]; then echo "versionName not found in app/build.gradle"; exit 1; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"

      - name: Stop if the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.name }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.name }} already exists: bump versionName first."
            exit 1
          fi

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "TitanPointer-${{ steps.version.outputs.name }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          v="${{ steps.version.outputs.name }}"
          if [ -z "$NOTES" ]; then NOTES="TitanPointer $v. Install TitanPointer-$v.apk."; fi
          gh release create "v$v" "TitanPointer-$v.apk" \
            --target "$GITHUB_SHA" --title "Version $v" --notes "$NOTES"
